services:
  mongo:
    image: mongo:7
    ports:
      # Override when 27017 is taken on the host (e.g. a local mongod).
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_RAW_URI: mongodb://mongo:27017/provider_raw
      MONGO_TARGET_URI: mongodb://mongo:27017/provider_target
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BATCH_SIZE: 500
      WORKER_CONCURRENCY: 4
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
